apiVersion: apps/v1
kind: Deployment
metadata:
  name: apipulse-backend
  namespace: apipulse
  labels:
    app: apipulse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apipulse-backend
  template:
    metadata:
      labels:
        app: apipulse-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/OWNER/apipulse-backend:sha-REPLACE
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: apipulse-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
