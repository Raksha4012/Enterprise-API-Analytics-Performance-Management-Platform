apiVersion: apps/v1
kind: Deployment
metadata:
  name: apipulse-frontend
  namespace: apipulse
  labels:
    app: apipulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apipulse-frontend
  template:
    metadata:
      labels:
        app: apipulse-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/apipulse-frontend:sha-REPLACE
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: apipulse-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
