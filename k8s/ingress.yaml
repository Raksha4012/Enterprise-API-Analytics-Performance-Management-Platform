apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apipulse-ingress
  namespace: apipulse
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: apipulse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apipulse-frontend-service
                port:
                  number: 80
