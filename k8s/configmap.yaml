apiVersion: v1
kind: ConfigMap
metadata:
  name: apipulse-config
  namespace: apipulse
data:
  APP_ENV: "production"
  APP_NAME: "ApiPulse Enterprise"
  APP_VERSION: "1.0.0"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "apipulse"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CORS_ORIGINS: '["https://apipulse.example.com"]'
  LOG_LEVEL: "INFO"
