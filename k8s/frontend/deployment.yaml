apiVersion: apps/v1
kind: Deployment
metadata:
  name: apipulse-frontend
  namespace: apipulse
  labels:
    app: apipulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apipulse-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: apipulse-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/apipulse-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
