apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apipulse-backend-hpa
  namespace: apipulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apipulse-backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
