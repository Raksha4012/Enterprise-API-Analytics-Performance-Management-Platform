name: CD — Build, Push & Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/apipulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/apipulse-frontend

jobs:
  # ─────────────────────────────────────────────────────────
  # Build & push Docker images
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.version }}
      frontend_tag: ${{ steps.meta-frontend.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image ───────────────────────────────────
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ──────────────────────────────────
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # Deploy to Kubernetes
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply namespace and config
        run: |
          kubectl apply -f k8s/namespace.yaml --validate=false
          kubectl apply -f k8s/configmap.yaml --validate=false
    
      - name: Deploy infrastructure (Postgres, Redis)
        run: |
          kubectl apply -f k8s/postgres/ --validate=false
          kubectl apply -f k8s/redis/ --validate=false      
          kubectl rollout status statefulset/postgres -n apipulse --timeout=120s

      - name: Deploy backend
        run: |
          kubectl set image deployment/apipulse-backend \
            backend=${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }} \
            -n apipulse
          kubectl rollout status deployment/apipulse-backend -n apipulse --timeout=180s

      - name: Deploy frontend
        run: |
          kubectl set image deployment/apipulse-frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }} \
            -n apipulse
          kubectl rollout status deployment/apipulse-frontend -n apipulse --timeout=120s

      - name: Apply HPA and Ingress
        run: |
         kubectl apply -f k8s/hpa.yaml --validate=false
         kubectl apply -f k8s/ingress.yaml --validate=false
         

      - name: Smoke test — health check
        run: |
          kubectl run smoke-test --image=curlimages/curl:latest \
            --restart=Never --rm -it \
            -n apipulse \
            -- curl -sf http://apipulse-backend-service/health

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed for commit ${{ github.sha }}"
          # Add Slack/PagerDuty notification here if needed
